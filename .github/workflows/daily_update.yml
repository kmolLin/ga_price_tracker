name: 每日自動更新 Grand Archive 卡價

on:
  schedule:
    # 每天台灣時間早上 8:00 執行一次 (UTC 0:00)
    - cron: '0 0 * * *'
  # 支援在 GitHub 網頁手動點擊按鈕立即觸發測試
  workflow_dispatch:

# 關鍵權限：允許 Actions 對此 Repo 進行檔案寫入與 commit
permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 執行卡價抓取腳本
        run: |
          python fetch_prices.py

      - name: 檢查並提交新資料到 Repo (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 檢查是否有檔案變動，有變動才 commit，避免空 commit 報錯
          if git diff --staged --quiet; then
            echo "價格資料無重大變動，無需提交。"
          else
            git commit -m "chore: 自動更新卡價與走勢 [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi